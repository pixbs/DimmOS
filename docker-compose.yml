name: dimm-os-ci

services:
  postgres:
    image: postgres:16.9-bookworm
    environment:
      POSTGRES_DB: dimmos_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  tests:
    build:
      context: .
      dockerfile: Dockerfile.ci
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dimmos_test
      PAYLOAD_SECRET: ci-secret-placeholder-minimum-32-chars-long
      RECAPTCHA_SECRET_KEY: ci-placeholder
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      RESEND_DEFAULT_FROM_ADDRESS: noreply@example.test
      ANTHROPIC_API_KEY: test-placeholder
      NEXT_PUBLIC_POSTHOG_KEY: phc_test
      NEXT_PUBLIC_POSTHOG_HOST: http://127.0.0.1:3999
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      PAYLOAD_DISABLE_BLOB_STORAGE: "true"
      SEO_IMAGE_GENERATION_DISABLED: "true"
      DIMMOS_TEST_RUN: "true"
      TEST_SUITE: ${TEST_SUITE:-all}
      CI: "true"
    volumes:
      - ./artifacts:/app/artifacts
