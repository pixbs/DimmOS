name: dimm-os-ci

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dimmos_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ci:
    build:
      context: .
      dockerfile: Dockerfile.ci
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dimmos_test
      PAYLOAD_SECRET: ci-secret-placeholder-minimum-32-chars-long
      RECAPTCHA_SECRET_KEY: ci-placeholder
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      CI: "true"
    command: >
      sh -c "
        bun payload migrate &&
        bun run build &&
        bun test:int &&
        bunx playwright install --with-deps chromium &&
        bun test:e2e
      "
